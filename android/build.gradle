// Top-level build file where you can add configuration options common to all sub-projects/modules.
// F-Droid Compliant: Pure FOSS - No proprietary Google Play Services or Firebase plugins.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        // Removed com.google.gms:google-services to comply with F-Droid Anti-Features policy
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
