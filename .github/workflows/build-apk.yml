name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Colab Android Terminal APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ပြဿနာဖြစ်စေသော Gradle 9.x ဗားရှင်းအသစ်အစား တည်ငြိမ်မှုရှိသည့် ဗားရှင်းသို့ ပြောင်းလဲခြင်း
      - name: 🔧 Setup Gradle Version
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: 📦 Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          npm install -g @capacitor/cli

      - name: 🔨 Build Vite Web Application
        run: npm run build

      - name: 🔄 Sync Capacitor Android Platform
        run: |
          npx cap sync android

      - name: 🔑 Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: 🚀 Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 📋 Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Colab-Android-Terminal-v2.6-debug.apk
          echo "APK build complete: build-output/Colab-Android-Terminal-v2.6-debug.apk"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Colab-Android-Terminal-APK
          path: build-output/*.apk
          retention-days: 30
