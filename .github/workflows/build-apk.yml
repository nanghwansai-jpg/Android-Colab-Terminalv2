name: Build Android APK and AAB for Google Play & F-Droid

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Package (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: 📱 Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm install

      - name: 🔨 Build Web Application
        run: npm run build

      - name: 🔄 Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🔑 Grant Execute Permission for Gradlew
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: 🚀 Build Android AAB (Play Store) and APK (F-Droid/Debug)
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
            ./gradlew bundleRelease --stacktrace || true
          else
            gradle assembleDebug --stacktrace
            gradle bundleRelease --stacktrace || true
          fi

      - name: 📋 Prepare Artifacts Output
        run: |
          mkdir -p build-output
          # Copy APKs
          find android/app/build/outputs/ -type f -name "*.apk" -exec cp {} build-output/ \; || true
          # Copy AABs
          find android/app/build/outputs/ -type f -name "*.aab" -exec cp {} build-output/ \; || true
          # Normalize filenames if exists
          if [ -f build-output/app-debug.apk ]; then
            cp build-output/app-debug.apk build-output/Colab-Android-Terminal-v2.6-debug.apk
          fi
          if [ -f build-output/app-release.aab ]; then
            cp build-output/app-release.aab build-output/Colab-Android-Terminal-v2.6-release.aab
          fi
          echo "Generated artifacts in build-output:"
          ls -la build-output/

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Colab-Android-Terminal-Builds
          path: build-output/*
          retention-days: 30

      - name: 🏷️ Publish GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*
          draft: false
          prerelease: false
          generate_release_notes: true
