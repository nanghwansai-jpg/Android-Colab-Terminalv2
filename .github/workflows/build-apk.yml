name: Build Android APK and AAB for Google Play

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Package for Google Play Console
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm install

      - name: 🔨 Build Vite Web Application
        run: npm run build

      - name: 🔄 Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🔑 Grant Execute Permission for Gradlew
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: 🚀 Build Android AAB and APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleRelease --stacktrace || true

      - name: 📋 Prepare Artifacts Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Colab-Android-Terminal-v2.6-debug.apk || true
          find android/app/build/outputs/ -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} build-output/ \; || true

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Colab-Android-Terminal-Builds
          path: build-output/*
          retention-days: 30

      - name: 🏷️ Publish GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*
          draft: false
          prerelease: false
          generate_release_notes: true
